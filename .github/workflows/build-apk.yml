
name: Build ASHEN TOWN APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare game files
        shell: bash
        run: |
          set -e

          ZIP_FILE="ASHEN_TOWN_V38_GITHUB_PWA.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root"
            exit 1
          fi

          mkdir -p app/src/main/assets/site
          unzip -q "$ZIP_FILE" -d app/src/main/assets/site

          if [ ! -f app/src/main/assets/site/index.html ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          mkdir -p app/src/main/assets/site/vendor

          curl -L \
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" \
            -o app/src/main/assets/site/vendor/three.module.js

          sed -i \
            's|https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js|./vendor/three.module.js|g' \
            app/src/main/assets/site/index.html

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/ashentown/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AshenTown"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ashentown.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ashentown.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 38
                  versionName '38.0'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="ASHEN TOWN"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ashentown/app/MainActivity.kt <<'EOF'
          package com.ashentown.app

          import android.os.Bundle
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader
          import androidx.webkit.WebViewClientCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  )

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build()

                  webView = WebView(this)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = false
                  webView.settings.allowContentAccess = false
                  webView.settings.mediaPlaybackRequiresUserGesture = false

                  webView.webChromeClient = WebChromeClient()

                  webView.webViewClient = object : WebViewClientCompat() {
                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }
                  }

                  setContentView(webView)

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/site/index.html"
                  )
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASHEN-TOWN-APK-V38
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
