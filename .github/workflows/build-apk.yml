
name: Build ASHEN TOWN V47 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Add Android SDK to PATH
        run: |
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare game files
        run: |
          if [ ! -f "ASHEN_TOWN_V47_GITHUB_PWA.zip" ]; then
            echo "ERROR: V47 ZIP not found in repository root"
            exit 1
          fi

          mkdir -p game
          unzip -o ASHEN_TOWN_V47_GITHUB_PWA.zip -d game

          GAME_HTML=$(find game -type f -name index.html | head -n 1)

          if [ -z "$GAME_HTML" ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          GAME_DIR=$(dirname "$GAME_HTML")

          mkdir -p app/src/main/assets/site/vendor

          cp "$GAME_HTML" app/src/main/assets/site/index.html

          if [ -f "$GAME_DIR/manifest.webmanifest" ]; then
            cp "$GAME_DIR/manifest.webmanifest" app/src/main/assets/site/
          fi

          if [ -f "$GAME_DIR/icon.svg" ]; then
            cp "$GAME_DIR/icon.svg" app/src/main/assets/site/
          fi

          curl -fL \
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" \
            -o app/src/main/assets/site/vendor/three.module.js

          sed -i \
            's|https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js|./vendor/three.module.js|g' \
            app/src/main/assets/site/index.html

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/ashentown/game

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ASHEN_TOWN"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ashentown.game'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ashentown.game'
                  minSdk 23
                  targetSdk 35
                  versionCode 47
                  versionName '47.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="ASHEN TOWN"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ashentown/game/MainActivity.kt <<'EOF'
          package com.ashentown.game

          import android.app.Activity
          import android.os.Bundle
          import android.net.Uri
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build()

                  val webView = WebView(this)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.allowFileAccess = true
                  webView.settings.mediaPlaybackRequiresUserGesture = false

                  webView.webViewClient = object : WebViewClient() {

                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(request.url)
                      }

                      override fun shouldInterceptRequest(
                          view: WebView,
                          url: String
                      ): WebResourceResponse? {
                          return assetLoader.shouldInterceptRequest(Uri.parse(url))
                      }
                  }

                  webView.webChromeClient = WebChromeClient()

                  setContentView(webView)

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/site/index.html"
                  )
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASHEN-TOWN-APK-V47
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
